url: https://tidymapr.in4metrix.dev/

template:
  bootstrap: 5
  includes:
    # Readers can switch the site between light and dark (light-switch
    # below); plots and maps keep a white background in both (extra.css).
    # The CSP allows only the site's own scripts; GitHub Pages cannot send
    # security headers, so they are set as meta tags.
    in_header: |
      <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
      <meta name="referrer" content="strict-origin-when-cross-origin">
  opengraph:
    image:
      src: man/figures/logo.png
      alt: "tidymapr hex logo"
  light-switch: true
  bslib:
    primary: "#349295"
    secondary: "#11376B"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
    font-size-base: 1rem
    line-height-base: 1.65
    headings-font-weight: 700
    link-color: "#2A7F82"
    navbar-bg: "#11376B"
    border-radius: 0.5rem

# Every figure, including reference-page examples, on an opaque white
# background, so plots stay white when a reader switches the site to dark.
figures:
  bg: white
  dev.args:
    bg: white

repo:
  url:
    home:
  title: "tidymapr: tidy mapping, spatial analysis and publication cartography"
  description: >
    Publication-quality maps and spatial analysis in R, in the style of a
    desktop GIS and compatible with GeoSpaX (geospax.in4metrix.dev): automatic, explained map
    design, projections, legends and map furniture, GIS, CAD and remote
    sensing formats, fast C++ spatial statistics, terrain hydrology,
    spectral indices and diversity surfaces with tidydiversity.
  sidebar:
    structure: [links, license, community, citation, authors, dev]

reference:
  - title: Maps and cartography
    desc: Automatic, explained maps, thematic maps, projections, graticules, basemaps and GeoSpaX-style map furniture.
    contents:
      - geo_automap
      - geo-map
      - map_presets
      - geo-panels
      - geo_map3d
      - geo_webmap
      - thematic-maps
      - plot_sites
      - plot_geo
      - plot_topo
      - map-projection
      - map-furniture
      - geo_basemap
      - geo_breaks
      - geo_save
      - theme_tidymapr
      - ggplot_add.tmr_geo_basemap
  - title: Spatial analysis
    desc: Interpolation and kriging, spatial autocorrelation and hotspots, distances, computed in C++ on several cores.
    contents:
      - geo_interpolate
      - geo-local
      - geo_dbscan
      - geo_landscape
      - geo_moran
      - geo_distance
      - geo_decay
      - geo_mem
  - title: Terrain and hydrology
    desc: D8 flow direction, flow accumulation, watersheds, the topographic wetness index and terrain derivatives.
    contents:
      - geo-hydrology
      - geo_elevation
  - title: Remote sensing
    desc: Spectral indices with Otsu thresholds and spectral diversity in Hill numbers.
    contents:
      - geo_spectral_index
      - geo_spectral_diversity
      - geo-stac
  - title: Data input and output
    desc: GIS, CAD and remote sensing formats through GDAL, rasters and vectors as tidy objects, and environmental layers.
    contents:
      - geo-io
      - geo_layers
      - geo-vector
      - geo-raster
      - geo_as_sf
      - geo_extract
      - geo-map-interop
      - geo-bioclim
      - geo_gadm
  - title: Ecology with tidydiversity
    desc: Diversity surfaces, occurrence records, spatial diversity patterns, species distribution models and forest plot maps.
    contents:
      - geo_diversity_surface
      - plot_diversity_surface
      - geo_clean
      - geo_gbif
      - geo_as_features
      - geo_rarefy_spatial
      - geo_grain
      - geo_middomain
      - sdm
      - sdm_maxent
      - sdm_ensemble
      - stems_spatial
      - stems_habitat_test
  - title: Recipes
    desc: Read, write, check and run GeoSpaX recipes, shareable YAML workflows from data to map and report.
    contents:
      - geo-recipe
  - title: Example data
    contents:
      - png_ants_sites
      - geo_example_sites
      - geo_example_stems
      - geo_example_dem
      - geo_example_censuses
  - title: Package
    contents:
      - tidymapr-package
      - geo

articles:
  - title: Get started
    navbar: ~
    contents:
      - tidymapr
  - title: Papua New Guinea case studies
    contents:
      - articles/tutorials
      - articles/case-png-wilhelm
  - title: Guides
    contents:
      - articles/geospatial
  - title: Gallery
    contents:
      - articles/gallery
