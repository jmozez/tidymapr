# Publish the committed pkgdown site (docs/) to Vercel on every push to main.
# Needs the repository secret VERCEL_TOKEN (a Vercel token for the in4metrix team).
on:
  push:
    branches: [main]
    paths: ["docs/**", "vercel.json"]
  workflow_dispatch:

name: vercel

permissions: read-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'jmozez/tidymapr' }}
    env:
      VERCEL_ORG_ID: team_sQKBoVytwZq7ergPfB5Er8ZR
      VERCEL_PROJECT_ID: prj_f3J6BgiydONKyzVVk0wD7wvGBDDy
    steps:
      - uses: actions/checkout@v4
      - name: Deploy docs/ to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::Add the VERCEL_TOKEN secret"; exit 1; fi
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
