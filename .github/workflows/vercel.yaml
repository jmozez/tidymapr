# Publish the pkgdown site to Vercel. pkgdown.yaml builds the site and pushes
# it to the gh-pages branch; this workflow then deploys that branch.
# Needs the repository secret VERCEL_TOKEN.
on:
  workflow_run:
    workflows: [pkgdown.yaml]
    types: [completed]
    branches: [main]
  workflow_dispatch:

name: vercel

permissions: read-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'jmozez/tidymapr' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    env:
      VERCEL_ORG_ID: team_sQKBoVytwZq7ergPfB5Er8ZR
      VERCEL_PROJECT_ID: prj_f3J6BgiydONKyzVVk0wD7wvGBDDy
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            vercel.json
            .vercelignore
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: docs
      - name: Deploy docs/ to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::Add the VERCEL_TOKEN secret"; exit 1; fi
          rm -rf docs/.git
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
